<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #170f0a;
    --panel: #26190f;
    --panel-light: #32220f;
    --gold: #d4af37;
    --gold-dim: #8a6f22;
    --parchment: #f2e6c9;
    --parchment-dark: #d9c79f;
    --blood: #6e1c1c;
    --text: #ecdfc0;
    --text-dim: #b3a583;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  :root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  html { scroll-behavior:smooth; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.10), transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(110,28,28,0.12), transparent 50%),
      repeating-linear-gradient(115deg, rgba(212,175,55,0.025) 0px, rgba(212,175,55,0.025) 2px, transparent 2px, transparent 26px),
      repeating-linear-gradient(25deg, rgba(212,175,55,0.02) 0px, rgba(212,175,55,0.02) 2px, transparent 2px, transparent 26px);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    min-height: 100vh;
    padding: 20px 16px 60px;
    position: relative;
  }
  body::before {
    content:'';
    position: fixed; inset:0; pointer-events:none; z-index:0;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.75);
  }
  h1,h2,h3,.display { font-family: 'Playfair Display', serif; }
  .wrap { max-width: 900px; margin: 0 auto; position:relative; z-index:1; }

  .titlebar { text-align:center; margin-bottom: 20px; }
  .titlebar h1 { font-size: clamp(24px,5vw,38px); color: var(--gold); letter-spacing:1.5px; text-shadow: 0 2px 14px rgba(0,0,0,0.7), 0 0 30px rgba(212,175,55,0.15); }
  .titlebar p { color: var(--text-dim); font-style: italic; margin-top:5px; }
  .ornateDivider { display:flex; align-items:center; gap:10px; margin: 6px auto 18px; max-width:340px; }
  .ornateDivider::before, .ornateDivider::after { content:''; flex:1; height:1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
  .ornateDivider::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .ornateDivider span { color: var(--gold); font-size:12px; }

  .panel {
    background: linear-gradient(180deg, var(--panel), #1c130c);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.2);
  }
  .center { text-align:center; }
  .muted { color: var(--text-dim); font-size: 14px; }

  button {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    background: linear-gradient(180deg, var(--gold), #8a6f22);
    color: #201404;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 6px 16px rgba(212,175,55,0.25); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    box-shadow:none;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform:none; }
  select, input[type=text] {
    font-family: 'Cormorant Garamond', serif;
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid var(--gold-dim);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 15px;
  }
  label { font-size: 13px; color: var(--text-dim); display:block; margin-bottom:4px; letter-spacing:0.5px; text-transform:uppercase; }

  #musicToggle, #sfxToggle, #musicFileBtn {
    position: fixed; top: 10px; z-index: 200;
    background: rgba(20,13,7,0.75); border:1px solid var(--gold-dim);
    color: var(--gold); width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow: none; padding:0;
  }
  #musicToggle { right: 10px; }
  #sfxToggle { right: 58px; }
  #musicFileBtn { right: 106px; cursor:pointer; }

  /* -------- setup -------- */
  .playerCountRow { display:flex; gap:8px; justify-content:center; margin: 14px 0 20px; flex-wrap:wrap; }
  .countBtn {
    width: 46px; height: 46px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px; font-weight:700;
    background: var(--panel-light); color: var(--text);
    border: 1px solid var(--gold-dim); cursor:pointer;
  }
  .countBtn.active { background: var(--gold); color:#201404; }
  .nameRow { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; padding:12px; background:var(--panel-light); border-radius:8px; border:1px solid rgba(212,175,55,0.15); }
  .nameRowTop { display:flex; align-items:center; gap:12px; }
  .avatarWrap { width:44px; height:44px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#1c130c; border:2px solid var(--gold-dim); }
  .nameRowTop .charName { font-family:'Playfair Display',serif; font-size:15px; color: var(--gold); width:140px; }
  .nameRowTop input { flex:1; }
  .colorRow { display:flex; gap:6px; flex-wrap:wrap; padding-left:56px; }
  .swatch { width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,0.15); transition: transform .1s; }
  .swatch.selected { border-color: var(--gold); transform: scale(1.18); box-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .swatch.usedByOther { opacity: 0.15; cursor:not-allowed; }

  /* -------- pass device barrier -------- */
  .barrier {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px 16px; gap:14px;
  }
  .barrier .icon { font-size: 40px; }
  .barrier h2 { color: var(--gold); font-size: clamp(20px,5vw,28px); }
  .charBadge { display:inline-flex; align-items:center; gap:10px; padding:8px 18px 8px 8px; background:var(--panel-light); border:1px solid var(--gold-dim); border-radius:30px; }
  .charBadge .avatarWrap { width:34px; height:34px; }

  /* -------- board -------- */
  .boardArea { display:flex; gap:16px; flex-wrap:wrap; }
  .moveHint { text-align:center; font-size:13px; color: var(--gold); font-style:italic; margin-bottom:8px; min-height:18px; }
  .boardWrap { flex: 1 1 440px; min-width: 0; }
  .cboard {
    display:grid;
    grid-template-columns: repeat(24, 1fr);
    grid-template-rows: repeat(25, 1fr);
    gap: 1px;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 24/25;
    margin: 0 auto;
    background: #120c06;
    padding: 4px;
    border-radius: 8px;
    border: 2px solid var(--gold-dim);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .sq {
    background: #d9c38a;
    border-radius: 1px;
    position: relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(90,60,20,0.35);
  }
  .sq.start { background: #8b6b3a; }
  .sq.door-t { box-shadow: inset 0 3px 0 #7a1f1f, inset 0 0 0 1px rgba(90,60,20,0.35); }
  .sq.door-b { box-shadow: inset 0 -3px 0 #7a1f1f, inset 0 0 0 1px rgba(90,60,20,0.35); }
  .sq.door-l { box-shadow: inset 3px 0 0 #7a1f1f, inset 0 0 0 1px rgba(90,60,20,0.35); }
  .sq.door-r { box-shadow: inset -3px 0 0 #7a1f1f, inset 0 0 0 1px rgba(90,60,20,0.35); }
  .sq.reach { background: #fff3c4; cursor:pointer; animation: sqPulse 1.1s ease-in-out infinite; z-index:1; }
  .sq.reach:empty::after { content:''; width:36%; height:36%; border-radius:50%; background: #b8860b; opacity:0.75; }
  @keyframes sqPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.12) saturate(1.3); } }
  .room {
    background: radial-gradient(circle at 30% 20%, #4a3620, #22170a 85%);
    border: 1px solid var(--gold-dim);
    color: var(--parchment);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; overflow:hidden; padding:2px;
  }
  .room.reach { cursor:pointer; outline: 2px solid var(--gold); outline-offset:-2px; animation: roomPulse 1.1s ease-in-out infinite; z-index:1; }
  @keyframes roomPulse { 0%,100% { box-shadow: inset 0 0 8px rgba(212,175,55,0.35); } 50% { box-shadow: inset 0 0 22px rgba(212,175,55,0.8); } }
  .room.here { outline: 2px solid var(--parchment); outline-offset:-2px; }
  .room .roomIconWrap { color: var(--gold); opacity:0.85; line-height:0; }
  .room .roomIconWrap svg { width: clamp(12px,3vw,24px); height: clamp(12px,3vw,24px); }
  .room .rname { font-family:'Playfair Display',serif; font-size: clamp(7px,1.5vw,12px); line-height:1.1; margin-top:1px; }
  .room.photo { background-color:#22170a; background-size: cover; background-position: center bottom; padding:0; justify-content:flex-start; }
  .room.photo::after { content:''; position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 18px rgba(0,0,0,0.55); }
  .roomOverlay { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:4%; }
  .roomOverlay > div { background: rgba(18,12,6,0.72); border-radius: 8px; padding: 2px 4px; }
  .room .weaponRow { display:flex; gap:1px; color: #e9d9a8; opacity:0.9; line-height:0; margin-top:2px; }
  .room .weaponRow svg { width: clamp(9px,1.8vw,15px); height: clamp(9px,1.8vw,15px); }
  .secretIcon { z-index:2; text-shadow: 0 0 4px #000; position:absolute; font-size: clamp(8px,1.6vw,12px); line-height:1; }
  .centerBlock {
    background: repeating-linear-gradient(45deg, #2a1a0c 0 6px, #24160a 6px 12px);
    border: 1px solid var(--gold-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color: var(--gold); font-family:'Playfair Display',serif; text-align:center;
  }
  .centerBlock .ctitle { font-size: clamp(10px,2.4vw,20px); font-weight:800; letter-spacing:2px; }
  .centerBlock .cenv { font-size: clamp(12px,3vw,26px); }
  .tokenRow { display:flex; flex-wrap:wrap; gap:1px; justify-content:center; margin-top:1px; }
  .token {
    width: clamp(7px,1.9vw,14px); height: clamp(7px,1.9vw,14px); border-radius:50%;
    border: 1px solid rgba(0,0,0,0.7);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
    flex: none;
  }
  .token.me { box-shadow: 0 0 0 2px #fff, 0 0 6px 2px rgba(255,255,255,0.8); }
  .boardLegend { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; font-size:12px; color: var(--text-dim); margin-top:8px; }
  .boardLegend span { display:inline-flex; align-items:center; gap:4px; }
  .lg { width:12px; height:12px; display:inline-block; border-radius:2px; }

  .sidePanel { flex:1; min-width: 240px; }
  .infoRow { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px;}
  .diceDisplay { font-size: 30px; text-align:center; margin: 10px 0; letter-spacing: 8px; }
  .actionBtns { display:flex; flex-direction:column; gap:8px; margin-top: 10px; }

  .log { max-height: 180px; overflow-y:auto; font-size: 13px; color: var(--text-dim); display:flex; flex-direction:column; gap:4px; }
  .log div { border-bottom: 1px dashed rgba(200,180,120,0.15); padding-bottom:4px; }
  .log div.important { color: var(--gold); }

  .cardsRow { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .card {
    background: var(--parchment);
    color: #241708;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    min-width: 90px;
    text-align:center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    border: 1px solid var(--parchment-dark);
    font-family: 'Playfair Display', serif;
  }
  .card .kind { font-size:10px; text-transform:uppercase; color:#7a5a2a; letter-spacing:1px; }
  .card svg { width:24px; height:24px; margin-bottom:2px; }
  .card .cardPhoto { display:block; width:112px; height:70px; object-fit:cover; object-position:center 35%; border-radius:4px; margin:0 auto 4px; }

  .modalOverlay {
    position: fixed; inset:0; background: rgba(8,5,2,0.92);
    display:flex; align-items:center; justify-content:center; z-index: 90; padding:16px;
  }
  .modalBox {
    background: var(--panel); border:1px solid var(--gold-dim); border-radius:10px;
    padding: 22px; max-width: 420px; width:100%; max-height: 85vh; overflow-y:auto;
  }
  .modalBox h2 { color: var(--gold); margin-bottom: 14px; text-align:center; }
  .fieldGroup { margin-bottom: 14px; }
  .fieldGroup select { width:100%; }

  .revealCard {
    background: var(--parchment); color:#241708; border-radius:10px; padding: 26px;
    text-align:center; font-family:'Playfair Display',serif; font-size: 20px;
    box-shadow: 0 0 30px rgba(212,175,55,0.4);
    margin: 16px 0;
  }
  .revealCard svg { width:40px; height:40px; margin-bottom:8px; }

  .choiceGrid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 14px 0; }
  .choiceGrid button { flex:1; min-width:120px; }

  .startScreen p.lead { color:var(--text-dim); line-height:1.6; margin-bottom: 14px; }
  ul.rules { margin: 10px 0 10px 20px; color: var(--text-dim); line-height:1.7; font-size:14px;}
  ul.rules li { margin-bottom:4px; }

  /* -------- not defteri (parşömen kağıdı hissi) -------- */
  .notesPad {
    background: var(--parchment);
    background-image: repeating-linear-gradient(rgba(120,90,42,0.06) 0px, rgba(120,90,42,0.06) 1px, transparent 1px, transparent 27px);
    color: #241708;
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 8px;
    box-shadow: inset 0 0 24px rgba(90,60,20,0.25), 0 4px 12px rgba(0,0,0,0.4);
  }
  .notesColumns { display:flex; gap:20px; flex-wrap:wrap; }
  .notesCol { min-width:150px; flex:1; }
  .notesCatTitle {
    font-weight:700; font-style:italic; color: var(--blood);
    font-size:16px; margin-bottom:6px; padding-bottom:3px;
    border-bottom: 1px solid rgba(110,28,28,0.35);
  }
  .noteItem { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0; font-size:14px; }
  .noteItem .niLabel { display:flex; align-items:center; gap:5px; }
  .noteItem svg { width:15px; height:15px; flex-shrink:0; }
  .noteBox {
    width:22px; height:22px; border:1.5px solid #7a5a2a; border-radius:4px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-weight:800; color:#241708; background: rgba(255,255,255,0.25); flex-shrink:0;
  }
  .noteBox:hover { background: rgba(255,255,255,0.5); }

  #hidden { display:none !important; }

  @media (max-width: 640px) {
    .boardArea { flex-direction: column; }
  }
</style>
</head>
<body>
<button id="musicToggle" title="Müziği aç/kapat">🎵</button>
<button id="sfxToggle" title="Ses efektlerini aç/kapat">🔊</button>
<label id="musicFileBtn" title="Kendi müzik dosyanı çal (yalnızca bu tarayıcıda)">📂<input type="file" id="musicFile" accept="audio/*" hidden></label>

<div class="wrap">
  <div class="titlebar">
    <h1>🕯️ CLUEDO 🕯️</h1>
    <div class="ornateDivider"><span>❖</span></div>
    <p>Bir gece, bir cinayet, altı şüpheli...</p>
  </div>

  <div id="app"></div>
</div>

<script>
/* ======================= SVG İKON KÜTÜPHANESİ ======================= */

function roomIconInner(id) {
  const paths = {
    R_kutuphane: `<rect x="9" y="46" width="46" height="4" rx="1" fill="currentColor"/>
      <rect x="13" y="20" width="7" height="26" rx="1" fill="currentColor"/>
      <rect x="22" y="26" width="7" height="20" rx="1" fill="currentColor"/>
      <rect x="31" y="14" width="7" height="32" rx="1" fill="currentColor"/>
      <rect x="40" y="22" width="7" height="24" rx="1" fill="currentColor"/>
      <rect x="49" y="18" width="6" height="28" rx="1" fill="currentColor"/>`,
    R_hol: `<rect x="9" y="11" width="46" height="36" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="16" y="18" width="32" height="22" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="25" cy="27" r="3" fill="currentColor"/>
      <path d="M19 36 L29 25 L37 33 L45 26 L45 36 Z" fill="currentColor"/>
      <path d="M9 11 L4 6 M55 11 L60 6" stroke="currentColor" stroke-width="2"/>`,
    R_kis: `<path d="M32 52 V27" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 31 C19 27 16 14 16 14 C16 14 27 15 32 28" fill="currentColor"/>
      <path d="M32 27 C45 22 48 9 48 9 C48 9 37 11 32 25" fill="currentColor"/>
      <path d="M32 40 C24 37 21 30 21 30 C21 30 28 30 32 37" fill="currentColor"/>
      <rect x="22" y="52" width="20" height="9" rx="2" fill="currentColor"/>`,
    R_calisma: `<path d="M13 51 L39 15 L44 19 L18 55 Z" fill="currentColor"/>
      <path d="M39 15 C42 11 47 10 50 13 C50 13 47 16 44 19 Z" fill="currentColor"/>
      <circle cx="15" cy="52" r="3" fill="currentColor"/>`,
    R_balo: `<path d="M32 8 V16" stroke="currentColor" stroke-width="2"/>
      <path d="M12 16 H52 L45 30 H19 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M19 30 L16 50 M32 30 L32 50 M45 30 L48 50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="11" r="3" fill="currentColor"/><circle cx="32" cy="8" r="3" fill="currentColor"/><circle cx="48" cy="11" r="3" fill="currentColor"/>`,
    R_mutfak: `<path d="M17 10 L17 26 C17 31 24 31 24 26 L24 10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <line x1="20.5" y1="10" x2="20.5" y2="32" stroke="currentColor" stroke-width="2.4"/>
      <path d="M38 32 C38 18 49 18 49 10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="12" y="34" width="38" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M18 34 C18 30 22 30 22 34 M28 34 C28 30 32 30 32 34" stroke="currentColor" stroke-width="1.6" fill="none"/>`,
    R_salon: `<path d="M10 30 C10 22 18 22 18 30 L46 30 C46 22 54 22 54 30 L54 44 L10 44 Z" fill="currentColor"/>
      <rect x="18" y="24" width="28" height="10" rx="3" fill="currentColor"/>
      <rect x="12" y="44" width="4" height="7" fill="currentColor"/><rect x="48" y="44" width="4" height="7" fill="currentColor"/>`,
    R_bilardo: `<circle cx="22" cy="40" r="8" fill="currentColor"/><circle cx="40" cy="40" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="31" cy="26" r="8" fill="currentColor"/><path d="M8 8 L26 20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>`,
    R_yemek: `<circle cx="32" cy="34" r="16" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="34" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8 14 V30 M5 14 V22 C5 26 11 26 11 22 V14" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M56 14 C51 18 51 26 56 28 V52" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  };
  return paths[id] || '';
}
function roomIconSVG(id, size=22) {
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}">${roomIconInner(id)}</svg>`;
}

function weaponIconInner(id) {
  const paths = {
    samdan: `<path d="M32 6 C28 12 30 16 32 16 C34 16 36 12 32 6 Z" fill="currentColor"/><rect x="28" y="17" width="8" height="14" rx="1" fill="currentColor"/><path d="M22 31 H42 L38 36 H26 Z" fill="currentColor"/><rect x="30" y="36" width="4" height="14" fill="currentColor"/><path d="M20 58 C20 50 44 50 44 58 Z" fill="currentColor"/>`,
    bicak: `<path d="M32 6 L36 30 L28 30 Z" fill="currentColor"/><rect x="29" y="30" width="6" height="18" fill="currentColor"/><rect x="22" y="46" width="20" height="4" rx="1" fill="currentColor"/><rect x="30" y="48" width="4" height="10" rx="1" fill="currentColor"/>`,
    ip: `<path d="M10 20 C10 44 54 20 54 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="10" cy="20" r="4" fill="currentColor"/><circle cx="54" cy="44" r="4" fill="currentColor"/>`,
    boru: `<rect x="8" y="27" width="48" height="10" rx="2" fill="currentColor"/><rect x="6" y="24" width="7" height="16" rx="1" fill="currentColor"/><rect x="51" y="24" width="7" height="16" rx="1" fill="currentColor"/>`,

function neighbors(pos) {
  const [r,c] = pos.split(',').map(Number);
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]

let audioStarted = false;
// Özgün beste: re minör, 116 BPM; pizzicato bas, santur benzeri arpej, keman benzeri melodi, hafif perküsyon
const midi = n => 440 * Math.pow(2, (n-69)/12);
const SONG = {
  bpm: 116,
  // 8 ölçü: kök (bas) ve akor notaları
  chords: [
    { root:50, tones:[62,65,69] },    // Dm
    { root:45, tones:[61,64,67] },    // A7
    { root:50, tones:[62,65,69] },    // Dm

    { root:43, tones:[62,67,70] },    // Gm
    { root:50, tones:[62,65,69] },    // Dm

  ],
  // melodi: ölçü başına 8 sekizlik, null = sus
  lead: [

    [73,null,76,79,76,73,69,null],

    [73,76,79,76,73,null,null,null],
  ],
};
const Music = {
  ctx:null, master:null, synthBus:null, on:true, running:false, timer:null, step:0, cycle:0, nextTime:0, noise:null, userAudio:null,
  init(ctx) {
    this.ctx = ctx;
    this.master = ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(ctx.destination);
    this.synthBus = ctx.createGain(); this.synthBus.gain.value = 0.55; this.synthBus.connect(this.master);
    const len = ctx.sampleRate * 0.3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
  },
  voice(freq, t, dur, { type='triangle', vol=0.1, attack=0.005, cutoff=4000, vibrato=0 } = {}) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (vibrato) {
      const l = ctx.createOscillator(); l.frequency.value = 5.5;
      const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(freq*vibrato, t + dur*0.6);
      l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    o.connect(f); f.connect(g); g.connect(this.synthBus);
    o.start(t); o.stop(t + dur + 0.05);
  },
  hit(t, vol, cutoff, dur) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noise;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = cutoff; f.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.synthBus); src.start(t); src.stop(t + dur + 0.02);
  },
  playStep(step, t) {
    const s16 = 60 / SONG.bpm / 4;
    const bar = Math.floor(step / 16), pos = step % 16;
    const ch = SONG.chords[bar];
    // pizzicato bas: oom-pa oom-pa
    if (pos===0 || pos===8) this.voice(midi(ch.root), t, 0.32, { type:'triangle', vol:0.22, cutoff:900 });
    if (pos===4 || pos===12) this.voice(midi(ch.root+7), t, 0.22, { type:'triangle', vol:0.14, cutoff:900 });
    if (pos===14 && bar%2===1) this.voice(midi(ch.root+12), t, 0.18, { type:'triangle', vol:0.12, cutoff:900 });
    // santur benzeri arpej (her onaltılık)
    const arp = [0,1,2,1, 2,0,1,2, 0,1,2,1, 2,1,0,1];
    const tone = ch.tones[arp[pos]] + (pos>=8 && bar%2 ? 12 : 0);
    this.voice(midi(tone), t, 0.18, { type:'sawtooth', vol: pos%4===0 ? 0.035 : 0.022, cutoff:2600 });
    this.voice(midi(tone)*1.004, t, 0.14, { type:'square', vol:0.008, cutoff:3200 });
    // perküsyon
    if (pos===4 || pos===12) this.hit(t, 0.12, 1800, 0.09);
    if (pos%2===1) this.hit(t, 0.025, 7000, 0.03);
    if (pos===0 && bar%4===0) this.voice(midi(38), t, 0.4, { type:'sine', vol:0.25, cutoff:400 });
    // melodi: ilk turdan sonra girer
    if (this.cycle > 0 && pos%2===0) {
      const n = SONG.lead[bar][pos/2];
      if (n) this.voice(midi(n), t, s16*1.8, { type:'sawtooth', vol:0.055, attack:0.02, cutoff:2200, vibrato:0.006 });
    }
  },
  schedule() {
    const s16 = 60 / SONG.bpm / 4;
    while (this.nextTime < this.ctx.currentTime + 0.15) {
      if (this.on && !this.userAudio) this.playStep(this.step, this.nextTime);
      this.nextTime += s16;
      this.step = (this.step + 1) % (SONG.chords.length * 16);
      if (this.step === 0) this.cycle++;
    }
  },
  start() {
    if (this.running || !this.ctx) return;
    this.running = true;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 40);
  },
  toggle() {
    this.on = !this.on;
    if (this.userAudio) { if (this.on) this.userAudio.play().catch(()=>{}); else this.userAudio.pause(); }
    if (this.synthBus) this.synthBus.gain.linearRampToValueAtTime(this.on?0.55:0, this.ctx.currentTime+0.3);
    return this.on;
  },
  useFile(file) {
    if (this.userAudio) { this.userAudio.pause(); URL.revokeObjectURL(this.userAudio.src); }
    const a = new Audio(URL.createObjectURL(file));
    a.loop = true; a.volume = 0.6;
    this.userAudio = a;
    if (this.on) a.play().catch(()=>{});
  }
};

function beep(freq,dur,type='sine',vol=0.12) {
  if (!sfxOn || !Music.ctx) return;
  const ctx = Music.ctx;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  o.connect(g); g.connect(Music.master); o.start(); o.stop(ctx.currentTime+dur);
}

let G = null;

function freshGame(playerCount, playerNames, playerColors) {
  const chosenChars = CHARACTERS.slice(0, playerCount);
  const players = chosenChars.map((c,i) => ({
    idx:i, name: playerNames[i] || c.name, character: c.id,
    color: playerColors[i] || COLOR_PALETTE[i].hex,
    node: c.start, hand: [], eliminated:false, notes:{}, pulledIn:false
  }));

  let suspectCards = CHARACTERS.map(c=>({type:'suspect', id:c.id}));
  let weaponCards = WEAPONS.map(w=>({type:'weapon', id:w.id}));
  let roomCards = ROOMS.map(r=>({type:'room', id:r.id}));
  function pick(arr){ return arr.splice(Math.floor(Math.random()*arr.length),1)[0]; }
  const solution = { suspect: pick(suspectCards), weapon: pick(weaponCards), room: pick(roomCards) };

  let deck = [...suspectCards, ...weaponCards, ...roomCards];
  for (let i=deck.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  deck.forEach((card,i) => players[i % players.length].hand.push(card));

  // Silahlar orijinal oyundaki gibi farklı odalara rastgele dağıtılır
  const roomOrder = ROOMS.map(r=>r.id).sort(() => Math.random()-0.5);
  const weaponLoc = {};
  WEAPONS.forEach((w,i) => weaponLoc[w.id] = roomOrder[i]);

  return {
    players, solution, currentPlayerIndex:0,
    diceRemaining:0, diceRolled:null, hasMovedThisTurn:false, enteredRoom:false, suggestedThisTurn:false, weaponLoc,
    log:[{ text:'Malikanede karanlık bir gece başlıyor... Zarf mühürlendi.', important:true }],
    winner:null, gameOver:false, pendingSuggestion:null,
    screen:'reveal-hand', handRevealIndex:0
  };
}

function currentPlayer() { return G.players[G.currentPlayerIndex]; }
function log(text, important) { G.log.unshift({text, important:!!important}); render(); }

/* ======================= HAREKET ======================= */

// Zar sonucu kadar (en fazla) kare ilerleme: koridorda dolu karelerden geçilemez,
// odaya yalnızca kapıdan girilir, girişle hareket biter, az önce çıkılan odaya geri girilemez.
function computeMoves(p, steps) {
  const occupied = new Set(G.players.filter(o => o!==p && !isRoom(o.node)).map(o => o.node));
  const dist = new Map(); const queue = [];
  const fromRoom = isRoom(p.node) ? p.node : null;
  if (fromRoom) {
    ROOM_BY_ID[fromRoom].doors.forEach(([r,c]) => { const k=posKey(r,c); if (!occupied.has(k)) { dist.set(k,1); queue.push(k); } });
  } else { dist.set(p.node,0); queue.push(p.node); }
  while (queue.length) {
    const k = queue.shift(); const d = dist.get(k);
    if (d >= steps) continue;
    neighbors(k).forEach(n => { if (!dist.has(n) && !occupied.has(n)) { dist.set(n,d+1); queue.push(n); } });
  }
  const squares = new Set([...dist.entries()].filter(([k,d]) => d>0 && d<=steps).map(([k]) => k));
  const rooms = new Set();
  ROOMS.forEach(rm => {
    if (rm.id === fromRoom) return;
    if (rm.doors.some(([r,c]) => { const d = dist.get(posKey(r,c)); return d!==undefined && d < steps; })) rooms.add(rm.id);
  });
  return { squares, rooms };
}

function moveTo(target) {
  const p = currentPlayer();
  p.node = target;
  G.diceRemaining = 0;
  G.hasMovedThisTurn = true;
  if (isRoom(target)) { G.enteredRoom = true; log(`${p.name} (${charName(p.character)}) ${ROOM_BY_ID[target].to} girdi.`); }
  else { log(`${p.name} koridorda ilerledi.`); }
  render();
}

function useSecretPassage() {
  const p = currentPlayer();
  const room = ROOM_BY_ID[p.node];
  if (!room || !room.secretTo) return;
  p.node = room.secretTo; G.diceRemaining = 0; G.hasMovedThisTurn = true; G.enteredRoom = true;
  log(`${p.name} gizli geçidi kullanarak ${ROOM_BY_ID[room.secretTo].to} geçti!`, true);
  render();
}

function rollDice() {
  ensureAudio(); sfxDice();
  const d1 = 1+Math.floor(Math.random()*6), d2 = 1+Math.floor(Math.random()*6);
  G.diceRolled = [d1,d2]; G.diceRemaining = d1+d2;
  render();
}

function endMovementEarly() { G.diceRemaining = 0; G.hasMovedThisTurn = true; render(); }

function openSuggestion() { G.screen = 'suggestion-modal'; render(); }

function submitSuggestion(suspectId, weaponId) {
  const p = currentPlayer();
  const roomId = p.node;
  const controllingPlayer = G.players.find(pl => pl.character === suspectId);
  if (controllingPlayer && controllingPlayer !== p) { controllingPlayer.node = roomId; controllingPlayer.pulledIn = true; }
  G.weaponLoc[weaponId] = roomId;
  G.suggestedThisTurn = true;

  log(`${p.name}, ${ROOM_BY_ID[roomId].at} "${charName(suspectId)}, ${weaponName(weaponId)} ile" önerisinde bulundu.`, true);

  const order = [];
  for (let i=1;i<G.players.length;i++) order.push((G.currentPlayerIndex+i) % G.players.length);

  G.pendingSuggestion = { room:roomId, suspect:suspectId, weapon:weaponId, askerIdx:G.currentPlayerIndex, refuterQueue:order, queuePos:0 };
  G.screen = 'board';
  advanceRefuteQueue();
}

function advanceRefuteQueue() {
  const s = G.pendingSuggestion;
  if (!s) return;
  if (s.queuePos >= s.refuterQueue.length) {
    log('Hiç kimse bu öneriyi çürütemedi! Bu önemli bir ipucu olabilir...', true);
    G.pendingSuggestion = null; G.screen = 'board'; render(); return;
  }
  const pIdx = s.refuterQueue[s.queuePos];
  const player = G.players[pIdx];
  const matches = player.hand.filter(c =>
    (c.type==='suspect' && c.id===s.suspect) || (c.type==='weapon' && c.id===s.weapon) || (c.type==='room' && c.id===s.room)
  );
  if (matches.length > 0) {
    s.currentResponderIdx = pIdx; s.matches = matches;
    G.screen = 'barrier-refute'; render();
  } else { s.queuePos++; advanceRefuteQueue(); }
}

function chooseRefuteCard(card) {
  sfxCard();
  const s = G.pendingSuggestion;
  s.chosenCard = card;
  G.screen = 'barrier-refute-back'; render();
}

function finishRefuteReveal() {
  const s = G.pendingSuggestion;
  const asker = G.players[s.askerIdx], responder = G.players[s.currentResponderIdx];
  log(`${responder.name}, ${asker.name}'in önerisini özel olarak çürüttü.`);
  G.pendingSuggestion = null; G.screen = 'board'; render();
}

/* ======================= SUÇLAMA ======================= */

function openAccusation() { G.screen = 'accusation-modal'; render(); }

function submitAccusation(suspectId, weaponId, roomId) {
  const p = currentPlayer();
  const correct = suspectId === G.solution.suspect.id && weaponId === G.solution.weapon.id && roomId === G.solution.room.id;
  if (correct) {
    G.winner = p; G.gameOver = true;
    log(`${p.name} doğru suçlamayı yaptı ve gizemi çözdü!`, true);
    G.screen = 'gameover'; render();
  } else {
    p.eliminated = true;
    log(`${p.name} bir suçlamada bulundu ama YANILDI. Artık hamle yapamayacak (ama ipucu vermeye devam edecek).`, true);
    const activeLeft = G.players.filter(pl => !pl.eliminated);
    if (activeLeft.length === 0) { G.gameOver = true; G.winner = null; G.screen = 'gameover'; render(); }
    else { G.screen = 'board'; endTurn(); }
  }
}

/* ======================= TUR YÖNETİMİ ======================= */

function endTurn() {
  currentPlayer().pulledIn = false;
  G.diceRemaining = 0; G.diceRolled = null; G.hasMovedThisTurn = false; G.enteredRoom = false; G.suggestedThisTurn = false;
  let next = G.currentPlayerIndex;
  do { next = (next+1) % G.players.length; } while (G.players[next].eliminated && G.players.some(pl=>!pl.eliminated));
  G.currentPlayerIndex = next;
  G.screen = 'barrier-turn-start'; render();
}

/* ======================= RENDER ======================= */

const app = document.getElementById('app');

function render() {
  // Önceki render'dan kalan modal pencereler oyunu kilitlemesin
  document.querySelectorAll('.modalOverlay').forEach(el => el.remove());
  if (!G) { renderSetup(); return; }
  if (G.screen === 'reveal-hand') { renderHandReveal(); return; }
  if (G.screen === 'barrier-turn-start') { renderTurnStartBarrier(); return; }
  if (G.screen === 'barrier-refute') { renderRefuteBarrier(); return; }
  if (G.screen === 'barrier-refute-back') { renderRefuteBackBarrier(); return; }
  if (G.screen === 'suggestion-modal') { renderBoard(); renderSuggestionModal(); return; }
  if (G.screen === 'accusation-modal') { renderBoard(); renderAccusationModal(); return; }
  if (G.screen === 'gameover') { renderGameOver(); return; }
  renderBoard();
}

/* ---- ana tahta ---- */
function renderCBoard(p, moves) {
  let html = '';
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const kind = CELL[r][c];
    if (kind!=='corr' && kind!=='start') continue;
    const k = posKey(r,c);
    const door = DOORS[k];
    const reach = moves.squares.has(k);
    const occ = G.players.filter(o => o.node === k);
    html += `<div class="sq ${kind==='start'?'start':''} ${door?'door-'+door.dir:''} ${reach?'reach':''}" style="grid-row:${r+1};grid-column:${c+1}" data-pos="${k}"${door?` title="${roomName(door.room)} kapısı"`:''}>${occ.map(o=>`<div class="token ${o===p?'me':''}" style="background:${o.color}" title="${o.name} (${charName(o.character)})"></div>`).join('')}</div>`;
  }
  ROOMS.forEach(rm => {
    const reach = moves.rooms.has(rm.id);
    rm.rects.forEach(([r0,c0,r1,c1], i) => {
      const style = `grid-row:${r0+1}/${r1+2};grid-column:${c0+1}/${c1+2}`;
      if (i > 0) { html += `<div class="room ${reach?'reach':''}" style="${style};border-bottom:none" data-pos="${rm.id}"></div>`; return; }
      const occ = G.players.filter(o => o.node === rm.id);
      const weapons = WEAPONS.filter(w => G.weaponLoc[w.id] === rm.id);
      const corner = rm.secretTo ? `<div class="secretIcon" style="${r0<5?'bottom':'top'}:2px;${c0<5?'right':'left'}:3px" title="Gizli geçit: ${roomName(rm.secretTo)}">🌀</div>` : '';
      html += `<div class="room photo ${reach?'reach':''} ${p.node===rm.id?'here':''}" style="${style};background-image:url('${rm.img}')" data-pos="${rm.id}" title="${rm.name}" aria-label="${rm.name}">
        ${corner}
        <div class="roomOverlay">
          ${weapons.length ? `<div class="weaponRow">${weapons.map(w=>`<span title="${w.name}">${weaponIconSVG(w.id,14)}</span>`).join('')}</div>` : ''}
          ${occ.length ? `<div class="tokenRow">${occ.map(o=>`<div class="token ${o===p?'me':''}" style="background:${o.color}" title="${o.name} (${charName(o.character)})"></div>`).join('')}</div>` : ''}
        </div>
      </div>`;
    });
  });
  html += `<div class="centerBlock" style="grid-row:${CENTER[0]+1}/${CENTER[2]+2};grid-column:${CENTER[1]+1}/${CENTER[3]+2}"><div class="ctitle">CLUEDO</div><div class="cenv">✉️</div></div>`;
  return html;
}

  const canSecret = inRoom && room.secretTo && !G.hasMovedThisTurn && !p.eliminated && G.diceRolled===null;

    if (G.diceRolled === null) hint = 'Zar atarak turunuza başlayın.';
    else if (G.diceRemaining > 0) hint = (moves.squares.size || moves.rooms.size)

      : 'Yol kapalı, bu tur hareket edemezsiniz.';

            <span><i class="lg" style="background:#8b6b3a"></i>Başlangıç</span>
            <span>🌀 Gizli geçit</span>

        </div>

        <div class="sidePanel">
          ${G.diceRolled ? `<div class="diceDisplay">🎲${G.diceRolled[0]} 🎲${G.diceRolled[1]}</div>` : `<div class="center muted" style="padding:20px 0;">Zar atmayı bekliyor...</div>`}

          <div class="actionBtns">
            ${canRoll ? `<button id="rollBtn">🎲 Zar At</button>` : ''}
            ${canSecret ? `<button id="secretBtn" class="secondary">🌀 Gizli Geçit: ${roomName(room.secretTo)}</button>` : ''}
            ${G.diceRemaining>0 ? `<button id="stopMoveBtn" class="secondary">Yerinde Kal</button>` : ''}
            ${canSuggest ? `<button id="suggestBtn">🔍 Öneride Bulun</button>` : ''}

            ${canEndTurn ? `<button id="endTurnBtn" class="secondary">Turu Bitir →</button>` : ''}
          </div>

          <details style="margin-top:14px;">
            <summary style="cursor:pointer; color:var(--gold);">Elimdeki Kartlar</summary>
            <div class="cardsRow">${p.hand.map(c=>renderCardHTML(c)).join('')}</div>

  const secretBtn = document.getElementById('secretBtn'); if (secretBtn) secretBtn.onclick = useSecretPassage;
  const stopBtn = document.getElementById('stopMoveBtn'); if (stopBtn) stopBtn.onclick = endMovementEarly;
  const suggestBtn = document.getElementById('suggestBtn'); if (suggestBtn) suggestBtn.onclick = openSuggestion;
  const accuseBtn = document.getElementById('accuseBtn'); if (accuseBtn) accuseBtn.onclick = openAccusation;
  const endTurnBtn = document.getElementById('endTurnBtn'); if (endTurnBtn) endTurnBtn.onclick = () => { sfxClick(); endTurn(); };

  };
}

/* ---- suçlama modalı ---- */
function renderAccusationModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modalBox">
      <h2>⚖️ Son Suçlama</h2>
      <p class="muted center" style="margin-bottom:14px;">Dikkat: yanlış tahmin ederseniz oyundan elenirsiniz!</p>
      <div class="fieldGroup"><label>Şüpheli</label><select id="accSuspect">${CHARACTERS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div class="fieldGroup"><label>Silah</label><select id="accWeapon">${WEAPONS.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></div>
      <div class="fieldGroup"><label>Oda</label><select id="accRoom">${ROOMS.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div>
      <div class="center" style="display:flex; gap:10px; justify-content:center;">
        <button class="secondary" id="cancelAccBtn">Vazgeç</button>
        <button id="confirmAccBtn">Suçlamayı Yap</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('cancelAccBtn').onclick = () => { overlay.remove(); G.screen='board'; render(); };
  document.getElementById('confirmAccBtn').onclick = () => {
    const s = document.getElementById('accSuspect').value, w = document.getElementById('accWeapon').value, r = document.getElementById('accRoom').value;
    overlay.remove(); submitAccusation(s,w,r);
  };
}

/* ---- oyun sonu ---- */
function renderGameOver() {
  app.innerHTML = `
    <div class="panel center">
      ${G.winner ? `
        <h1 style="color:var(--gold);">🏆 Gizem Çözüldü! 🏆</h1>
        <div class="avatarWrap" style="width:80px;height:80px;margin:14px auto;">${suspectAvatarSVG(G.winner.character, G.winner.color, 80)}</div>
        <p class="lead"><strong style="color:${G.winner.color}">${G.winner.name}</strong> doğru cevabı buldu!</p>
      ` : `
        <h1 style="color:var(--blood);">Gizem Çözülemedi...</h1>
        <p class="lead" style="margin:12px 0;">Tüm oyuncular yanlış suçlamalarda bulundu.</p>
      `}
      <h3 style="margin-top:10px; color:var(--gold);">Gerçek Cevap:</h3>
      <div class="cardsRow center" style="justify-content:center; margin-top:10px;">
        ${renderCardHTML(G.solution.suspect)}${renderCardHTML(G.solution.weapon)}${renderCardHTML(G.solution.room)}
      </div>
      <button id="newGameBtn" style="margin-top:20px;">Yeni Oyun</button>
    </div>
  `;
  document.getElementById('newGameBtn').onclick = () => { G = null; render(); };
}

/* ======================= BAŞLAT ======================= */
render();
</script>
</body>
</html>
