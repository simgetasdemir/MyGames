<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yıldız Avcısı - Hayatta Kalma</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060f;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #e6e9ff;
  }
  #gameContainer {
    position: relative;
    box-shadow: 0 0 60px rgba(80,120,255,0.35);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: radial-gradient(ellipse at center, #0d1030 0%, #020208 100%);
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 5;
  }
  #hud div { background: rgba(10,12,30,0.55); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(120,150,255,0.25); }
  #healthBarWrap {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 16px;
    background: rgba(10,12,30,0.6);
    border: 1px solid rgba(120,150,255,0.3);
    border-radius: 8px;
    overflow: hidden;
    z-index: 5;
  }
  #healthBar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #34d399, #22c55e);
    transition: width 0.15s ease;
  }
  #xpBarWrap {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 8px;
    background: rgba(10,12,30,0.6);
    border: 1px solid rgba(120,150,255,0.3);
    border-radius: 4px;
    overflow: hidden;
    z-index: 5;
  }
  #xpBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    transition: width 0.15s ease;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(3,4,12,0.85);
    text-align: center;
    z-index: 10;
    gap: 14px;
  }
  .overlay h1 { font-size: 34px; letter-spacing: 2px; color: #a5b4fc; text-shadow: 0 0 20px rgba(120,150,255,0.6); }
  .overlay p { color: #9ca3d6; max-width: 380px; line-height: 1.5; font-size: 14px; }
  button {
    background: linear-gradient(180deg, #6366f1, #4338ca);
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(99,102,241,0.5);
    transition: transform 0.1s ease;
  }
  button:hover { transform: translateY(-2px); }
  #hidden { display: none; }
  #levelUp {
    position: absolute;
    inset: 0;
    background: rgba(3,4,12,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 14px;
  }
  #levelUp h2 { color: #fbbf24; font-size: 24px; text-shadow: 0 0 14px rgba(251,191,36,0.6); }
  .upgradeRow { display: flex; gap: 14px; }
  .upgradeCard {
    background: rgba(20,22,50,0.9);
    border: 1px solid rgba(120,150,255,0.35);
    border-radius: 10px;
    padding: 16px;
    width: 160px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .upgradeCard:hover { transform: translateY(-4px); border-color: #a5b4fc; }
  .upgradeCard h3 { font-size: 15px; color: #c7d2fe; margin-bottom: 8px; }
  .upgradeCard p { font-size: 12px; color: #9ca3d6; line-height: 1.4; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hud">
    <div id="waveText">Dalga: 1</div>
    <div id="scoreText">Skor: 0</div>
    <div id="timeText">Süre: 0:00</div>
  </div>
  <div id="xpBarWrap"><div id="xpBar"></div></div>
  <div id="healthBarWrap"><div id="healthBar"></div></div>

  <div class="overlay" id="startScreen">
    <h1>⭐ YILDIZ AVCISI ⭐</h1>
    <p>Uzay gemini WASD veya ok tuşlarıyla yönet. Ateş etmek için fareye tıkla veya boşluk tuşuna bas (yön: fare imleci). Dalgalar halinde gelen düşmanlardan hayatta kal, seviye atla, gemini güçlendir!</p>
    <button id="startBtn">Oyuna Başla</button>
  </div>

  <div class="overlay" id="gameOverScreen" style="display:none;">
    <h1>GEMİ İMHA EDİLDİ</h1>
    <p id="finalStats"></p>
    <button id="restartBtn">Tekrar Dene</button>
  </div>

  <div id="levelUp">
    <h2>⚡ SEVİYE ATLADIN! Bir yükseltme seç ⚡</h2>
    <div class="upgradeRow" id="upgradeRow"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let keys = {};
let mouse = {x: W/2, y: H/2, down: false};

canvas.setAttribute('tabindex', '0');
canvas.style.outline = 'none';

const trackedKeys = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '];

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (trackedKeys.includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (trackedKeys.includes(k)) e.preventDefault();
});
canvas.addEventListener('click', () => canvas.focus());
document.addEventListener('click', () => canvas.focus());
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(min, max) { return Math.random() * (max - min) + min; }

// ---------- Game State ----------
let state = 'start'; // start, playing, levelup, gameover
let score = 0;
let wave = 1;
let elapsed = 0;
let lastTime = 0;

let player, bullets, enemies, particles, stars, xpOrbs, enemyBullets;

function initGame() {
  player = {
    x: W/2, y: H/2, r: 14,
    speed: 3.2,
    hp: 100, maxHp: 100,
    fireRate: 320, // ms
    lastFire: 0,
    bulletSpeed: 7,
    bulletDamage: 12,
    bulletCount: 1,
    spread: 0,
    pierce: 0,
    xp: 0, xpToNext: 20, level: 1,
    magnet: 60,
    regenTimer: 0,
    invuln: 0
  };
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  xpOrbs = [];
  stars = [];
  for (let i=0;i<120;i++) stars.push({x: rand(0,W), y: rand(0,H), r: rand(0.5,2), s: rand(0.2,1.2)});
  score = 0; wave = 1; elapsed = 0;
  spawnTimer = 0; waveTimer = 0;
  enemiesThisWave = 6;
  enemiesSpawned = 0;
}

let spawnTimer = 0, waveTimer = 0, enemiesThisWave = 6, enemiesSpawned = 0;

// ---------- Enemy types ----------
function spawnEnemy() {
  const edge = Math.floor(rand(0,4));
  let x, y;
  if (edge===0) { x = rand(0,W); y = -30; }
  else if (edge===1) { x = W+30; y = rand(0,H); }
  else if (edge===2) { x = rand(0,W); y = H+30; }
  else { x = -30; y = rand(0,H); }

  const roll = Math.random();
  let type;
  if (wave >= 5 && roll < 0.15) type = 'shooter';
  else if (wave >= 3 && roll < 0.35) type = 'fast';
  else if (wave >= 6 && roll < 0.45) type = 'tank';
  else type = 'basic';

  let e = {x, y, type};
  if (type === 'basic') { e.r=13; e.hp=20+wave*3; e.maxHp=e.hp; e.speed=1.1+wave*0.03; e.dmg=10; e.color='#f87171'; e.xp=5; }
  else if (type === 'fast') { e.r=9; e.hp=12+wave*2; e.maxHp=e.hp; e.speed=2.4+wave*0.05; e.dmg=8; e.color='#fbbf24'; e.xp=6; }
  else if (type === 'tank') { e.r=22; e.hp=90+wave*10; e.maxHp=e.hp; e.speed=0.6+wave*0.02; e.dmg=20; e.color='#a78bfa'; e.xp=15; }
  else if (type === 'shooter') { e.r=14; e.hp=25+wave*3; e.maxHp=e.hp; e.speed=0.8; e.dmg=8; e.color='#38bdf8'; e.xp=10; e.fireTimer=rand(0,1500); }
  enemies.push(e);
}

function startWave() {
  enemiesThisWave = 6 + wave*3;
  enemiesSpawned = 0;
  waveTimer = 0;
  document.getElementById('waveText').textContent = 'Dalga: ' + wave;
}

// ---------- Upgrades ----------
const upgradePool = [
  { name: 'Hızlı Ateş', desc: 'Ateş etme hızı %20 artar', apply: p => p.fireRate = Math.max(80, p.fireRate*0.8) },
  { name: 'Güçlü Mermi', desc: 'Mermi hasarı +6', apply: p => p.bulletDamage += 6 },
  { name: 'Çoklu Atış', desc: 'Bir mermi daha eklenir', apply: p => p.bulletCount += 1 },
  { name: 'Delici Mermi', desc: 'Mermiler bir düşman daha delip geçer', apply: p => p.pierce += 1 },
  { name: 'Hızlı Motor', desc: 'Hareket hızı +15%', apply: p => p.speed *= 1.15 },
  { name: 'Zırh Takviyesi', desc: 'Max can +25, can dolar', apply: p => { p.maxHp += 25; p.hp = p.maxHp; } },
  { name: 'Mıknatıs', desc: 'XP toplama menzili artar', apply: p => p.magnet += 40 },
  { name: 'Mermi Hızı', desc: 'Mermi hızı artar', apply: p => p.bulletSpeed += 2 },
];

function showLevelUp() {
  state = 'levelup';
  document.getElementById('levelUp').style.display = 'flex';
  const row = document.getElementById('upgradeRow');
  row.innerHTML = '';
  const choices = [...upgradePool].sort(()=>Math.random()-0.5).slice(0,3);
  choices.forEach(u => {
    const card = document.createElement('div');
    card.className = 'upgradeCard';
    card.innerHTML = `<h3>${u.name}</h3><p>${u.desc}</p>`;
    card.onclick = () => {
      u.apply(player);
      document.getElementById('levelUp').style.display = 'none';
      state = 'playing';
    };
    row.appendChild(card);
  });
}

// ---------- Update ----------
function update(dt) {
  elapsed += dt;
  const mins = Math.floor(elapsed/60000);
  const secs = Math.floor((elapsed%60000)/1000);
  document.getElementById('timeText').textContent = 'Süre: ' + mins + ':' + secs.toString().padStart(2,'0');

  // stars
  stars.forEach(s => { s.y += s.s; if (s.y>H) { s.y=0; s.x=rand(0,W); } });

  // player movement
  let dx=0, dy=0;
  if (keys['w']||keys['arrowup']) dy -= 1;
  if (keys['s']||keys['arrowdown']) dy += 1;
  if (keys['a']||keys['arrowleft']) dx -= 1;
  if (keys['d']||keys['arrowright']) dx += 1;
  const len = Math.hypot(dx,dy);
  if (len>0) { dx/=len; dy/=len; }
  player.x += dx*player.speed*(dt/16.67);
  player.y += dy*player.speed*(dt/16.67);
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  if (player.invuln>0) player.invuln -= dt;

  // regen slight
  player.regenTimer += dt;
  if (player.regenTimer > 4000) { player.regenTimer=0; player.hp = Math.min(player.maxHp, player.hp+1); }

  // firing
  player.lastFire += dt;
  const firing = mouse.down || keys[' '];
  if (firing && player.lastFire >= player.fireRate) {
    player.lastFire = 0;
    const angleBase = Math.atan2(mouse.y-player.y, mouse.x-player.x);
    const count = player.bulletCount;
    const spreadTotal = (count-1)*0.18;
    for (let i=0;i<count;i++) {
      const ang = angleBase - spreadTotal/2 + i*0.18;
      bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(ang)*player.bulletSpeed,
        vy: Math.sin(ang)*player.bulletSpeed,
        dmg: player.bulletDamage,
        pierce: player.pierce,
        r: 4
      });
    }
  }

  // bullets
  bullets.forEach(b => { b.x += b.vx*(dt/16.67); b.y += b.vy*(dt/16.67); });
  bullets = bullets.filter(b => b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

  // spawn logic
  spawnTimer += dt;
  const spawnInterval = Math.max(350, 1000 - wave*40);
  if (enemiesSpawned < enemiesThisWave && spawnTimer > spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
    enemiesSpawned++;
  }
  waveTimer += dt;
  if (enemiesSpawned >= enemiesThisWave && enemies.length === 0) {
    wave++;
    startWave();
  }

  // enemy update
  enemies.forEach(e => {
    const ang = Math.atan2(player.y-e.y, player.x-e.x);
    e.x += Math.cos(ang)*e.speed*(dt/16.67);
    e.y += Math.sin(ang)*e.speed*(dt/16.67);

    if (e.type==='shooter') {
      e.fireTimer += dt;
      if (e.fireTimer > 1800 && dist(e,player) < 500) {
        e.fireTimer = 0;
        const a2 = Math.atan2(player.y-e.y, player.x-e.x);
        enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a2)*4,vy:Math.sin(a2)*4,r:5,dmg:12});
      }
    }

    if (dist(e,player) < e.r+player.r && player.invuln<=0) {
      player.hp -= e.dmg;
      player.invuln = 500;
      spawnParticles(player.x, player.y, '#f87171', 8);
      if (player.hp <= 0) endGame();
    }
  });

  // enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx*(dt/16.67); b.y += b.vy*(dt/16.67); });
  enemyBullets = enemyBullets.filter(b => {
    if (b.x<-20||b.x>W+20||b.y<-20||b.y>H+20) return false;
    if (dist(b,player) < b.r+player.r && player.invuln<=0) {
      player.hp -= b.dmg;
      player.invuln = 500;
      spawnParticles(player.x, player.y, '#f87171', 6);
      if (player.hp <= 0) endGame();
      return false;
    }
    return true;
  });

  // bullet-enemy collisions
  bullets.forEach(b => {
    if (b.dead) return;
    for (let e of enemies) {
      if (e.dead) continue;
      if (dist(b,e) < b.r+e.r) {
        e.hp -= b.dmg;
        spawnParticles(e.x, e.y, e.color, 4);
        if (b.pierce > 0) { b.pierce--; } else { b.dead = true; }
        if (e.hp <= 0) {
          e.dead = true;
          score += 10;
          xpOrbs.push({x:e.x, y:e.y, val:e.xp, r:6});
          spawnParticles(e.x, e.y, e.color, 14);
        }
        if (b.dead) break;
      }
    }
  });
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // xp orbs
  xpOrbs.forEach(o => {
    const d = dist(o, player);
    if (d < player.magnet) {
      const ang = Math.atan2(player.y-o.y, player.x-o.x);
      o.x += Math.cos(ang)*5;
      o.y += Math.sin(ang)*5;
    }
    if (d < player.r+o.r) {
      o.collected = true;
      player.xp += o.val;
      if (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.xpToNext = Math.floor(player.xpToNext*1.35);
        player.level++;
        showLevelUp();
      }
    }
  });
  xpOrbs = xpOrbs.filter(o => !o.collected);

  // particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life -= dt; p.vx*=0.94; p.vy*=0.94; });
  particles = particles.filter(p => p.life > 0);

  // HUD
  document.getElementById('scoreText').textContent = 'Skor: ' + score;
  document.getElementById('healthBar').style.width = Math.max(0,(player.hp/player.maxHp*100)) + '%';
  document.getElementById('xpBar').style.width = (player.xp/player.xpToNext*100) + '%';
}

function spawnParticles(x,y,color,n) {
  for (let i=0;i<n;i++) {
    particles.push({
      x, y,
      vx: rand(-3,3), vy: rand(-3,3),
      life: rand(300,600), maxLife: 600,
      color
    });
  }
}

// ---------- Draw ----------
function draw() {
  ctx.clearRect(0,0,W,H);
  // stars
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => { ctx.globalAlpha = 0.6; ctx.fillRect(s.x, s.y, s.r, s.r); });
  ctx.globalAlpha = 1;

  // xp orbs
  xpOrbs.forEach(o => {
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,7); ctx.fill();
  });

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0,p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // enemy bullets
  enemyBullets.forEach(b => {
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  });

  // bullets
  bullets.forEach(b => {
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill();
    // hp bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2, 4);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2*(e.hp/e.maxHp), 4);
  });

  // player
  ctx.save();
  const angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);
  ctx.translate(player.x, player.y);
  ctx.rotate(angle);
  if (player.invuln > 0 && Math.floor(player.invuln/100)%2===0) ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#93c5fd';
  ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(-12,10);
  ctx.lineTo(-6,0);
  ctx.lineTo(-12,-10);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- Loop ----------
function loop(t) {
  if (!lastTime) lastTime = t;
  const dt = Math.min(50, t - lastTime);
  lastTime = t;

  if (state === 'playing') update(dt);
  draw();

  requestAnimationFrame(loop);
}

function endGame() {
  state = 'gameover';
  document.getElementById('finalStats').textContent =
    `Skor: ${score} | Ulaşılan Dalga: ${wave} | Seviye: ${player.level}`;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('startScreen').style.display = 'none';
  initGame();
  startWave();
  state = 'playing';
  canvas.focus();
};
document.getElementById('restartBtn').onclick = () => {
  document.getElementById('gameOverScreen').style.display = 'none';
  initGame();
  startWave();
  state = 'playing';
  canvas.focus();
};

// init stars for start screen background
stars = [];
for (let i=0;i<120;i++) stars.push({x: rand(0,W), y: rand(0,H), r: rand(0.5,2), s: rand(0.2,1.2)});

// başlangıçta tüm oyun nesnelerini boş/güvenli halde başlat ki
// "Oyuna Başla" tıklanmadan önce draw() çökmesin
player = { x: W/2, y: H/2, r: 14, hp: 100, maxHp: 100, xp: 0, xpToNext: 20, level: 1, invuln: 0 };
bullets = [];
enemyBullets = [];
enemies = [];
particles = [];
xpOrbs = [];

requestAnimationFrame(loop);
canvas.focus();
window.addEventListener('load', () => canvas.focus());
setTimeout(() => canvas.focus(), 300);
</script>
</body>
</html>
