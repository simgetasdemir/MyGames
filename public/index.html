<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cluedo Çevrimiçi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .connBar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--blood); color: var(--parchment); text-align:center; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 300; background: #3a1212; color: var(--parchment); border: 1px solid #8f2323; border-radius: 8px; padding: 10px 16px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,0.6); font-size: 16px; }

  .homeGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .homeGrid .panel { margin-bottom: 0; display:flex; flex-direction:column; gap: 12px; }
  .homeGrid input[type=text] { width: 100%; font-size: 17px; }
  .codeInput { text-transform: uppercase; letter-spacing: 6px; font-size: 22px !important; text-align:center; font-family: 'Playfair Display', serif !important; }
  .altLink { color: var(--gold); }

  .lobbyCode { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .lobbyCode .code { font-family: 'Playfair Display', serif; font-size: clamp(40px, 12vw, 64px); letter-spacing: 12px; color: var(--gold); line-height: 1; padding-left: 12px; }
  .shareRow { display:flex; gap: 8px; width: 100%; max-width: 520px; flex-wrap: wrap; }
  .shareRow input { flex: 1 1 220px; min-width: 0; font-size: 14px; }
  .playerList { display:flex; flex-direction:column; gap: 8px; }
  .playerRow { display:flex; align-items:center; gap: 10px; padding: 8px 10px; border: 1px solid #3d2c14; border-radius: 8px; background: rgba(0,0,0,0.18); }
  .playerRow .pname { font-weight: 600; font-size: 17px; }
  .playerRow .pmeta { margin-left: auto; display:flex; gap: 6px; align-items:center; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .chip.off { color: #e9a3a3; border-color: #8f2323; }
  .chip.turn { background: var(--gold); color: #201404; border-color: var(--gold); }
  .chip.out { color: var(--text-dim); border-color: #5c4716; text-decoration: line-through; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #16a34a; flex: none; }
  .dot.off { background: #8f2323; }
  .charGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .charBtn { display:flex; flex-direction:column; align-items:center; gap: 4px; padding: 10px 6px; background: var(--panel-light); color: var(--text); border: 1px solid #5c4716; box-shadow:none; }
  .charBtn.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .charBtn .who { font-size: 12px; color: var(--text-dim); min-height: 15px; }

  .turnBanner { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .turnBanner .you { margin-left: auto; }
  .pendingBanner { border: 1px solid var(--gold-dim); background: rgba(212,175,55,0.08); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 16px; }
  .revealBox { border: 1px solid var(--gold); border-radius: 8px; padding: 10px; margin-top: 10px; background: rgba(212,175,55,0.08); }
  .revealBox .card { display:inline-block; margin-top: 6px; }
  .sideSection { margin-top: 14px; }
  .sideSection h3 { color: var(--gold); font-size: 17px; margin-bottom: 6px; }
  .solutionBox { border: 1px dashed #8f2323; border-radius: 8px; padding: 10px; margin-top: 10px; color: var(--parchment); }
  .gameOverBox { text-align:center; display:flex; flex-direction:column; gap: 12px; align-items:center; }
  .sidePanel .card { min-width: 88px; padding: 6px 8px; }
  .sidePanel .card .cardPhoto { width: 88px; height: 55px; }
  .noteBox { padding: 0; box-shadow: none; font-size: 14px; font-family: inherit; }
  .noteBox:hover { transform: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .sq.reach, .room.reach { animation: none; } button { transition: none; } }

  /* ===== Açılış görselinin tonları: gece siyahı ahşap, yaldız altın, bordo kadife, parşömen ===== */
  :root {
    --bg: #0c0806; --panel: #15100b; --panel-light: #1f150d;
    --gold: #d9b25a; --gold-bright: #f3d58a; --gold-dim: #8a6a2c;
    --blood: #6d0f18; --velvet: #8f1c24; --parchment: #efe0b8; --text: #eadcb8; --text-dim: #b09a6e;
    --gilt: linear-gradient(180deg, #fbe7a6 0%, #e2bd66 38%, #b88a3c 62%, #8c6424 100%);
    --display: 'Cinzel', 'Playfair Display', Georgia, serif;
  }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(180deg, rgba(10,7,4,0.9), rgba(10,7,4,0.96)), url('images/giris.webp');
    background-size: cover; background-position: center top; background-attachment: fixed;
  }
  h1, h2, h3, .display { font-family: var(--display); letter-spacing: 0.06em; }
  .titlebar h1 { background: var(--gilt); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; font-size: clamp(34px, 7vw, 64px); text-shadow: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8)); }
  .titlebar .tagline { font-family: var(--display); font-style: normal; letter-spacing: 0.22em; text-transform: uppercase; font-size: 13px; color: var(--gold); }
  .panel {
    background: linear-gradient(180deg, rgba(23,16,10,0.95), rgba(13,9,6,0.97));
    border: 1px solid #b88d3e; border-radius: 4px;
    box-shadow: inset 0 0 0 4px rgba(13,9,6,0.95), inset 0 0 0 5px rgba(217,178,90,0.32), 0 12px 32px rgba(0,0,0,0.6);
  }
  .panel h2, .panel h3, .modalBox h2, .sideSection h3 { color: var(--gold); text-transform: uppercase; }
  button {
    font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 15px;
    background: var(--gilt); color: #1a1008; border: 1px solid rgba(243,213,138,0.45); border-radius: 3px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  button:hover { box-shadow: 0 6px 18px rgba(217,178,90,0.3), inset 0 1px 0 rgba(255,255,255,0.35); }
  button.secondary { background: rgba(13,9,6,0.7); color: var(--gold); border: 1px solid var(--gold-dim); box-shadow: none; }
  button.secondary:hover { border-color: var(--gold); color: var(--gold-bright); }
  label { font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; color: var(--text-dim); }
  select, input[type=text] { background: var(--panel-light); border: 1px solid var(--gold-dim); border-radius: 3px; color: var(--text); }
  select:focus, input[type=text]:focus { outline: 1px solid var(--gold-bright); border-color: var(--gold); }
  .modalOverlay { background: rgba(6,4,2,0.9); }
  .modalBox { background: #120d09; border: 1px solid #b88d3e; border-radius: 4px; box-shadow: inset 0 0 0 4px #120d09, inset 0 0 0 5px rgba(217,178,90,0.32), 0 20px 50px rgba(0,0,0,0.7); }
  .chip { font-family: var(--display); }
  .chip.turn { background: var(--gilt); color: #1a1008; border-color: transparent; }
  .chip.off { color: #f0b3b3; border-color: var(--velvet); background: rgba(109,15,24,0.35); }
  .pendingBanner { background: linear-gradient(90deg, rgba(109,15,24,0.45), rgba(109,15,24,0.15)); border: 1px solid var(--velvet); color: var(--parchment); }
  .revealBox { border-color: var(--gold); background: rgba(217,178,90,0.08); }
  .solutionBox { border-color: var(--velvet); background: rgba(109,15,24,0.25); }
  .playerRow { background: rgba(0,0,0,0.3); border-color: #3a2a14; }
  .charBtn, .noteBox, .choiceGrid button { text-transform: none; letter-spacing: 0; }
  .charBtn { font-family: 'Cormorant Garamond', serif; background: rgba(31,21,13,0.9); color: var(--text); border: 1px solid #5c4716; box-shadow: none; }
  .charBtn.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset, 0 0 18px rgba(217,178,90,0.25); }
  .lobbyCode .code { font-family: var(--display); background: var(--gilt); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cboard { border: 2px solid #b88d3e; box-shadow: 0 0 0 4px #120d09, 0 0 0 5px rgba(217,178,90,0.35), 0 14px 34px rgba(0,0,0,0.6); background: #0e0a06; }
  .centerBlock { background: repeating-linear-gradient(45deg, #1a0d0e 0 6px, #140a0b 6px 12px); border-color: var(--velvet); }
  .centerBlock .ctitle { font-family: var(--display); background: var(--gilt); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .log div.important { color: var(--gold-bright); }
  .srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ===== Giriş sayfası: tasarım görseli + üstüne yerleşen gerçek alanlar ===== */
  body.home .titlebar { display: none; }
  body.home .wrap { max-width: 1400px; }
  .landing {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 1683 / 935;
    background: #0c0806 url('images/giris.webp') center / 100% 100% no-repeat;
    border-radius: 6px; overflow: hidden; container-type: inline-size;
    box-shadow: 0 0 0 1px rgba(217,178,90,0.35), 0 20px 60px rgba(0,0,0,0.7);
  }
  .lf { display: contents; }
  .hot { position: absolute; margin: 0; }
  input.hot {
    background: #1f150d; border: none; border-radius: 1px; color: var(--parchment);
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.3cqw; padding: 0 0.5cqw;
  }
  input.hot::placeholder { color: #8f7a55; }
  input.hot:focus { outline: 1px solid var(--gold-bright); }
  .hot-code { text-align: center; text-transform: uppercase; letter-spacing: 0.9cqw; font-family: var(--display) !important; font-size: 1.35cqw !important; }
  button.hot { background: transparent; border: none; box-shadow: none; padding: 0; border-radius: 0.5cqw; transform: none; filter: none; }
  button.hot:hover { background: rgba(255,228,160,0.12); box-shadow: 0 0 2cqw rgba(243,213,138,0.4); transform: none; }
  button.hot:active { background: rgba(255,228,160,0.2); }
  button.hot:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  .hot-create-name { left: 31.31%; top: 49.09%; width: 13.96%; height: 3.64%; }
  .hot-play        { left: 28.99%; top: 55.51%; width: 16.46%; height: 5.35%; }
  .hot-code        { left: 56.09%; top: 49.09%; width: 14.38%; height: 3.64%; }
  .hot-join-name   { left: 56.33%; top: 56.36%; width: 14.14%; height: 3.64%; }
  .hot-join        { left: 54.07%; top: 61.60%; width: 16.58%; height: 4.71%; }
  .hot-tile        { top: 72.09%; width: 8.91%; height: 10.05%; }
  .hot-tile.t0 { left: 31.67%; } .hot-tile.t1 { left: 41.41%; } .hot-tile.t2 { left: 51.16%; } .hot-tile.t3 { left: 60.90%; }
  .rejoinPanel { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .mobileHome { display: none; }
  @media (max-width: 760px) {
    body.home .wrap { padding-top: 44px; }
    .landing { aspect-ratio: 2.65 / 1; background-size: 185% auto; background-position: 50% 7%; }
    .landing .hot { display: none; }
    .mobileHome { display: grid; gap: 14px; margin-top: 14px; }
    .mobileHome .panel { margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .mobileHome input[type=text] { width: 100%; font-size: 17px; }
    .mobileTiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  }

  /* bilgi pencereleri */
  .infoBox { max-width: 640px; }
  .infoList { margin-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.5; }
  .infoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .infoGrid.rooms { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .infoItem { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px; margin: 0; border: 1px solid #3a2a14; background: rgba(0,0,0,0.3); border-radius: 4px; }
  .infoItem img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 2px; }
  .infoItem figcaption { display: flex; flex-direction: column; gap: 2px; }
  .swatch { width: 38px; height: 6px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.5); }
  .weaponBig { color: var(--gold); line-height: 0; }
</style>
</head>
<body>
<button id="musicToggle" title="Müziği aç/kapat" aria-label="Müziği aç/kapat">🎵</button>
<button id="sfxToggle" title="Ses efektlerini aç/kapat" aria-label="Ses efektlerini aç/kapat">🔊</button>
<label id="musicFileBtn" title="Kendi müzik dosyanı çal (yalnızca bu tarayıcıda)">📂<input type="file" id="musicFile" accept="audio/*" hidden></label>

<div class="wrap">
  <div class="titlebar">
    <h1 id="gameTitle">CLUEDO</h1>
    <div class="ornateDivider"><span>❖</span></div>
    <p class="tagline">Bir gece, bir cinayet, altı şüpheli...</p>
  </div>
  <div id="conn" class="connBar" hidden>Sunucuyla bağlantı koptu, yeniden bağlanılıyor…</div>
  <div id="app"></div>
</div>
<p id="musicCredit" class="muted center" style="margin: 8px auto 0; max-width: 900px; font-size: 13px; position: relative; z-index: 1" hidden></p>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="shared/data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
